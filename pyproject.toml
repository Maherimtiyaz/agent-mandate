[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mandate"
version = "0.1.0"
description = "Delegated authority for AI agents: identity, scoped permissions, spend limits, human approval and a tamper-evident audit log."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "cryptography>=42",
  "pydantic>=2",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=2.0"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mandate*"]

[tool.setuptools.package-data]
mandate = ["web/*.html"]
